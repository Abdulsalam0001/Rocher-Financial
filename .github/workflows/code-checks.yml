name: Code & JavaScript checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check browser JavaScript syntax
        shell: bash
        run: |
          set -e
          files=$(find public/js -type f -name '*.js' -print)
          test -n "$files"
          for file in $files; do
            echo "Checking $file"
            node --check "$file"
          done
      - name: Check TypeScript
        run: npx tsc --noEmit
      - name: Verify Prisma client
        run: npx prisma generate

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Dashboard | Rocher Mutuel Financial</title><link rel="stylesheet" href="/css/app.css"><link rel="stylesheet" href="/css/dashboard.css"></head><body><header class="dash-header"><a class="auth-brand" href="/"><span>RM</span><div>ROCHER MUTUEL<small>FINANCIAL</small></div></a><button id="logout" class="ghost">Log out</button></header><main class="dash"><div class="welcome"><div><p class="eyebrow">PRIVATE CLIENT</p><h1 id="welcome">Welcome.</h1><p class="muted" id="email"></p></div></div><section id="accounts" class="account-grid"></section><section class="panel"><div class="panel-head"><div><p class="eyebrow">ACTIVITY</p><h2>Recent history</h2></div></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Reference</th><th>Type</th><th>Amount</th><th>Status</th></tr></thead><tbody id="transactions"></tbody></table></div></section><section class="panel security-panel"><div class="panel-head"><div><p class="eyebrow">ACCOUNT SECURITY</p><h2>Change password</h2><p class="muted">Update your password to keep your account secure.</p></div></div><form id="changePasswordForm" class="password-form"><input name="currentPassword" type="password" placeholder="Current password" autocomplete="current-password" required><input name="newPassword" type="password" placeholder="New password" minlength="8" autocomplete="new-password" required><input name="confirmPassword" type="password" placeholder="Confirm new password" minlength="8" autocomplete="new-password" required><button class="button" type="submit">Change password</button><p id="passwordMessage" class="form-message"></p></form></section></main><script src="/js/dashboard.js"></script></body></html>

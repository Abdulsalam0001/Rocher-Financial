<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Login | Rocher Mutuel Financial</title>
<link rel="stylesheet" href="/css/app.css?v=20260922">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.25/dist/sweetalert2.all.min.js"></script><script src="/js/alerts.js?v=20260926"></script></head>
<body class="auth-page admin-page">
<main class="auth-shell">
  <a class="auth-brand" href="/"><span>RM</span><div>ROCHER MUTUEL<small>ADMINISTRATION</small></div></a>
  <section class="auth-card">
    <p class="eyebrow">ADMINISTRATION</p>
    <h1>Secure staff access.</h1>
    <p class="muted">Authorized administrators only.</p>
    <form id="loginForm">
      <label>Email<input name="email" type="email" autocomplete="username" required></label>
      <label>Password<input id="passwordInput" name="password" type="password" autocomplete="current-password" required></label>
      <button class="button" type="submit">Enter administration</button>
      <p id="message" class="form-message"></p>
    </form>
  </section>
  <p class="auth-note">There is no public administrator registration.</p>
</main>
<script>
const form=document.querySelector("#loginForm"),message=document.querySelector("#message");
form.addEventListener("submit",async e=>{
  e.preventDefault();message.textContent="Signing in…";
  const data=Object.fromEntries(new FormData(form));
  try{
    const r=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({...data,area:"admin"})});
    const j=await r.json();if(!r.ok)throw new Error(j.error||"Unable to sign in.");
    location.href=j.redirect;
  }catch(err){message.textContent=err.message;RMAlert?.error("Sign-in failed",err.message);}
});
</script>
</body>
</html>

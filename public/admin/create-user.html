<body class="admin-app"><header class="dash-header"><a class="auth-brand" href="/admin/dashboard.html"><span>RM</span><div>ROCHER MUTUEL<small>ADMINISTRATION</small></div></a><nav class="admin-nav"><a href="/admin/dashboard.html">Overview</a><a href="/admin/create-user.html">Create user</a><a href="/admin/balances.html">Balances</a><a href="/admin/dashboard.html#history">History</a></nav><button id="logout" class="ghost">Log out</button></header>
<main class="dash"><section class="welcome"><p class="eyebrow">USER MANAGEMENT</p><h1>Create a customer.</h1><p class="muted">Create the customer profile, login credentials and their first account.</p></section>
<section class="panel"><div class="panel-head"><div><p class="eyebrow">NEW CUSTOMER</p><h2>Customer details</h2></div><a class="button small" href="/admin/dashboard.html">Back to dashboard</a></div>
<form id="createCustomer" class="create-form create-page-form"><input name="firstName" placeholder="First name" required><input name="lastName" placeholder="Last name" required><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Temporary password" minlength="8" required><input name="phone" placeholder="Phone"><input name="country" placeholder="Country"><select name="accountType"><option value="CURRENT">Current account</option><option value="SAVINGS">Savings</option><option value="PRIVATE">Private</option><option value="BUSINESS">Business</option></select><select name="currency"><option>EUR</option><option>USD</option><option>GBP</option></select><button class="button" type="submit">Create customer</button><p id="createMessage" class="form-message"></p></form></section></main>

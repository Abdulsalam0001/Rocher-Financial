<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration | Rocher Mutuel Financial</title><link rel="stylesheet" href="/css/app.css"><link rel="stylesheet" href="/css/dashboard.css"></head><body class="admin-app"><header class="dash-header"><a class="auth-brand" href="/"><span>RM</span><div>ROCHER MUTUEL<small>ADMINISTRATION</small></div></a><nav class="admin-nav"><a href="#overview">Overview</a><a href="#customers">Customers</a><a href="/admin/create-user.html">Create user</a><a href="/admin/balances.html">Balances</a><a href="#history">History</a></nav><button id="logout" class="ghost">Log out</button></header><main class="dash"><section class="welcome"><div><p class="eyebrow">ADMINISTRATION</p><h1>Operations overview.</h1><p class="muted" id="adminEmail"></p></div></section><section id="overview" class="stat-grid"><article class="stat"><span>Customers</span><strong id="customersCount">—</strong></article><article class="stat"><span>Accounts</span><strong id="accountsCount">—</strong></article><article class="stat"><span>Transactions</span><strong id="transactionsCount">—</strong></article><article class="stat"><span>Audit events</span><strong id="auditCount">—</strong></article></section><section id="customers" class="panel"><div class="panel-head"><div><p class="eyebrow">USER MANAGEMENT</p><h2>Customers</h2></div><button id="showCreate" class="button small" type="button">＋ Create user</button></div><form id="createCustomer" class="create-form"><input name="firstName" placeholder="First name" required><input name="lastName" placeholder="Last name" required><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Temporary password" minlength="8" required><input name="phone" placeholder="Phone"><input name="country" placeholder="Country"><select name="accountType"><option value="CURRENT">Current account</option><option value="SAVINGS">Savings</option><option value="PRIVATE">Private</option><option value="BUSINESS">Business</option></select><select name="currency"><option>EUR</option><option>USD</option><option>GBP</option></select><button class="button" type="submit">Create user</button><p id="createMessage" class="form-message"></p></form><div class="table-wrap"><table><thead><tr><th>Customer</th><th>Email</th><th>Account</th><th>Balance</th><th>Status</th></tr></thead><tbody id="customers"></tbody></table></div></section><section id="history" class="panel"><div class="panel-head"><div><p class="eyebrow">SYSTEM HISTORY</p><h2>Recent activity</h2></div></div><div id="historyList" class="history-list"></div></section></main><script src="/js/admin-dashboard.js"></script></body></html>

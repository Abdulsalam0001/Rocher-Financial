<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="canonical" href="https://rocherfinancial.cfd/contact.html"><title>Contact Customer Care | Rocher Mutuel Financial</title><link rel="stylesheet" href="/css/app.css?v=20260923"><link rel="stylesheet" href="/css/status-pages.css?v=20260923"><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.25/dist/sweetalert2.all.min.js"></script><script src="/js/alerts.js?v=20260926"></script></head><body class="client-app status-page"><main class="status-shell"><a class="auth-brand" href="/"><span>RM</span><div>ROCHER MUTUEL<small>FINANCIAL</small></div></a><section class="status-card contact-card"><p class="eyebrow">CUSTOMER CARE</p><h1>How can we help?</h1><p class="lead">Send a message to Rocher customer care. Your request is recorded securely for the support team.</p><form id="contactForm"><div class="form-row"><label>Name<input name="name" autocomplete="name" required></label><label>Email<input name="email" type="email" autocomplete="email" required></label></div><label>Subject<input name="subject" maxlength="120" required placeholder="How can we help?"></label><label>Message<textarea name="message" rows="7" maxlength="4000" required placeholder="Tell us what you need help with."></textarea></label><button class="button" type="submit">Send to customer care →</button><p id="contactMessage" class="form-message"></p></form><p class="support-email">You can also email <a href="mailto:support@rocherfinancial.cfd">support@rocherfinancial.cfd</a>.</p></section></main><script>const f=document.querySelector("#contactForm"),m=document.querySelector("#contactMessage");f.addEventListener("submit",async e=>{e.preventDefault();const b=f.querySelector("button");b.disabled=true;m.textContent="Sending…";try{const r=await fetch("/api/contact",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.fromEntries(new FormData(f)))});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Unable to send your message.");f.reset();m.textContent="Your message has been sent to customer care.";RMAlert?.success("Message sent","Customer care has received your request.")}catch(err){m.textContent=err.message||"Unable to send your message.";RMAlert?.error("Message not sent",err.message||"Unable to send your message.")}finally{b.disabled=false}});</script></body></html>
